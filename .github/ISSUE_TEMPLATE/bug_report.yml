name: Bug report
description: Something in KMate behaves differently from what you expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Clusters differ enormously, and most KMate bugs turn out to be
        environment-specific. The questions below are the ones we would
        otherwise have to ask you first.

        Found a security issue? Do not file it here — see
        [SECURITY.md](https://github.com/sahabti/kmate/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the cluster overview
        2. Click …
        3. …
    validations:
      required: true

  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes distribution and version
      placeholder: GKE 1.30, EKS 1.29, k3s, kind, OpenShift …
    validations:
      required: true

  - type: dropdown
    id: mesh
    attributes:
      label: Service mesh
      options: ["None", "Istio", "Linkerd", "Cilium", "Other"]
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where does the agent run?
      options: ["In-cluster (Helm)", "Out-of-cluster against a kubeconfig"]
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KMate version
      description: Image tag or chart version of the hub and agent.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Agent and hub logs
      description: >
        The agent logs the request kind and stream id, so include the lines
        around the failure rather than only the error. Redact anything private.
      render: shell
