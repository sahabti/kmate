apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  namespace: shop
  labels: { app.kubernetes.io/name: shop-frontend, app.kubernetes.io/part-of: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: shop-frontend } }
  template:
    metadata: { labels: { app: shop-frontend, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
        ports: [{ containerPort: 80, name: http }]
        resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-frontend
  namespace: shop
  labels: { app.kubernetes.io/part-of: shop }
  annotations:
    kmate.io/description: "Storefront web UI"
    kmate.io/icon: "shopping-cart"
spec:
  selector: { app: shop-frontend }
  ports: [{ name: http, port: 80, targetPort: 80, appProtocol: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: shop
  labels: { app.kubernetes.io/name: shop-api, app.kubernetes.io/part-of: shop }
spec:
  replicas: 3
  selector: { matchLabels: { app: shop-api } }
  template:
    metadata: { labels: { app: shop-api, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        args: ["-text=shop-api ok", "-listen=:8080"]
        ports: [{ containerPort: 8080, name: http }]
        resources: { requests: { cpu: 10m, memory: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: shop
  labels: { app.kubernetes.io/part-of: shop }
  annotations:
    kmate.io/description: "Orders and catalog API"
spec:
  selector: { app: shop-api }
  ports: [{ name: http, port: 8080, targetPort: 8080, appProtocol: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: shop.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: { service: { name: shop-frontend, port: { number: 80 } } }
      - path: /api
        pathType: Prefix
        backend: { service: { name: shop-api, port: { number: 8080 } } }
---
# A degraded service: selector matches nothing that is ready
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
  namespace: shop
  labels: { app.kubernetes.io/part-of: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: shop-worker } }
  template:
    metadata: { labels: { app: shop-worker, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep 3600"]
        readinessProbe: { exec: { command: ["false"] }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-worker
  namespace: shop
  labels: { app.kubernetes.io/part-of: shop }
spec:
  selector: { app: shop-worker }
  ports: [{ name: metrics, port: 9100 }]
---
# NodePort + LoadBalancer examples
apiVersion: v1
kind: Service
metadata:
  name: shop-admin
  namespace: shop
  labels: { app.kubernetes.io/part-of: shop }
spec:
  type: NodePort
  selector: { app: shop-frontend }
  ports: [{ name: http, port: 80, targetPort: 80, nodePort: 31080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: external-payments
  namespace: shop
spec:
  type: ExternalName
  externalName: payments.example.com
  ports: [{ port: 443 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  feature: "on"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db-credentials
  namespace: shop
type: Opaque
stringData:
  password: hunter2
