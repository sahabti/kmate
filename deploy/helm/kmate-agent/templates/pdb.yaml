{{- if (.Values.podDisruptionBudget | default dict).enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kmate-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kmate-agent.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ dig "maxUnavailable" 1 .Values.podDisruptionBudget }}
  selector:
    matchLabels: { app.kubernetes.io/name: kmate-agent }
{{- end }}
