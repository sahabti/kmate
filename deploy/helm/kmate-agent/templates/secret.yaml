{{- if not .Values.enrollment.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: kmate-agent-enrollment
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kmate-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  hubAddr: {{ required "hub.addr is required" .Values.hub.addr | quote }}
  enrollmentToken: {{ .Values.enrollment.token | quote }}
  {{- if .Values.hub.caBundle }}
  ca.crt: {{ .Values.hub.caBundle | quote }}
  {{- end }}
{{- end }}
