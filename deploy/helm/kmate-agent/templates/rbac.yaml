{{- if .Values.rbac.read }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmate-agent-reader
  labels: {{- include "kmate-agent.labels" . | nindent 4 }}
rules:
{{- if .Values.rbac.secretsRead }}
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
{{- else }}
# RBAC has no deny rule: enumerate core resources and non-core groups rather
# than granting *.*, which would include Secrets regardless of this toggle.
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "nodes", "namespaces", "events", "configmaps", "persistentvolumes", "persistentvolumeclaims", "replicationcontrollers", "serviceaccounts", "resourcequotas", "limitranges", "podtemplates"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps", "batch", "autoscaling", "networking.k8s.io", "policy", "storage.k8s.io", "discovery.k8s.io", "events.k8s.io", "rbac.authorization.k8s.io", "apiextensions.k8s.io", "apiregistration.k8s.io", "scheduling.k8s.io", "coordination.k8s.io", "node.k8s.io", "metrics.k8s.io", "gateway.networking.k8s.io", "networking.istio.io", "security.istio.io", "telemetry.istio.io", "extensions.istio.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
{{- end }}
{{- with .Values.rbac.extraReadRules }}
{{ toYaml . | nindent 0 }}
{{- end }}
- nonResourceURLs: ["/metrics", "/healthz", "/version", "/livez", "/readyz"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kmate-agent-reader
  labels: {{- include "kmate-agent.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kmate-agent-reader }
subjects:
- kind: ServiceAccount
  name: kmate-agent
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.write }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmate-agent-writer
  labels: {{- include "kmate-agent.labels" . | nindent 4 }}
rules:
{{- if .Values.rbac.secretsRead }}
- apiGroups: [""]
  resources: ["*"]
  verbs: ["create", "update", "patch", "delete"]
{{- else }}
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes", "namespaces", "events", "configmaps", "persistentvolumes", "persistentvolumeclaims", "replicationcontrollers", "serviceaccounts", "resourcequotas", "limitranges", "podtemplates"]
  verbs: ["create", "update", "patch", "delete"]
{{- end }}
- apiGroups: ["apps", "batch", "autoscaling", "networking.k8s.io", "policy", "gateway.networking.k8s.io"]
  resources: ["*"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
  verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kmate-agent-writer
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kmate-agent-writer }
subjects:
- { kind: ServiceAccount, name: kmate-agent, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- if .Values.rbac.exec }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmate-agent-exec
rules:
- apiGroups: [""]
  resources: ["pods/exec", "pods/attach", "pods/portforward"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kmate-agent-exec
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kmate-agent-exec }
subjects:
- { kind: ServiceAccount, name: kmate-agent, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- if .Values.rbac.impersonate }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kmate-agent-impersonator
rules:
- apiGroups: [""]
  resources: ["users", "groups", "serviceaccounts"]
  verbs: ["impersonate"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["userextras/*"]
  verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kmate-agent-impersonator
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kmate-agent-impersonator }
subjects:
- { kind: ServiceAccount, name: kmate-agent, namespace: {{ .Release.Namespace }} }
{{- end }}
---
# The agent stores its issued certificate in its own secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kmate-agent-self
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["kmate-agent-identity"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kmate-agent-self
  namespace: {{ .Release.Namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: kmate-agent-self }
subjects:
- { kind: ServiceAccount, name: kmate-agent, namespace: {{ .Release.Namespace }} }
