{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kmate-agent
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: kmate-agent }
  policyTypes: [Egress]
  egress:
  - {}  # Allow all egress; tighten to hub + apiserver CIDRs in production
{{- end }}
