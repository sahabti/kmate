{{- if and (.Values.podDisruptionBudget | default dict).enabled (gt (int (.Values.replicaCount | default 1)) 0) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kmate-hub.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kmate-hub.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "kmate-hub.selectorLabels" . | nindent 6 }}
{{- end }}
