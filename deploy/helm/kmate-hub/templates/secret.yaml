{{- if not .Values.admin.existingSecret }}
{{- $name := include "kmate-hub.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kmate-hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  # keep generated values stable across upgrades
  adminPassword: {{ index $existing.data "adminPassword" }}
  jwtSecret: {{ index $existing.data "jwtSecret" }}
  {{- else }}
  adminPassword: {{ .Values.admin.password | default (randAlphaNum 24) | b64enc }}
  jwtSecret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
