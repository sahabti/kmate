{{- if and .Values.oidc.enabled .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kmate-hub.name" . }}-oidc
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kmate-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  oidcClientSecret: {{ .Values.oidc.clientSecret | quote }}
{{- end }}
