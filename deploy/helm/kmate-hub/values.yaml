image:
  repository: kmate/hub
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1   # SQLite mode supports exactly one replica (phase 5: Postgres for more)

# Public URL browsers use (OIDC redirects, enrollment commands shown in the UI)
publicUrl: "https://kmate.example.com"
# Address agents should dial. For agents in the same cluster the in-cluster service is enough.
agentPublicAddr: ""   # default: <release>.<namespace>.svc.cluster.local:9090

# TLS: when terminated by an ingress/gateway in front of the hub, leave insecure=true
# (plaintext inside the cluster). Set false and provide tls.secretName to terminate in the hub.
insecure: true
tls:
  secretName: ""

# Agent authentication. Agents always enrol with a one-time token and keep a
# bearer token; mutual TLS is an optional upgrade on top of that.
#   off      no certificates are issued; agents authenticate with their token
#   optional certificates are issued and verified when present, tokens still accepted
#   required agents without a certificate are refused
agentMTLS: optional

admin:
  email: admin@kmate.local
  # Leave empty to generate a random password on first install (stored in a Secret, printed by NOTES).
  password: ""
  existingSecret: ""   # keys: adminPassword, jwtSecret

corsOrigins: "" # extra origins, comma separated (tauri://localhost etc. are always allowed)

# Single sign-on. Works with any standards-compliant OIDC provider (Keycloak,
# Okta, Authentik, Entra, Google, Dex): the hub reads the provider's discovery
# document, so only the issuer and client need configuring. See docs/12-oidc.md.
oidc:
  enabled: false
  issuer: ""            # e.g. https://keycloak.example.com/realms/kmate
  clientId: ""
  clientSecret: ""      # omit when using existingSecret
  existingSecret: ""    # secret with key oidcClientSecret
  scopes: ""            # default: openid profile email. Okta/Authentik also need "groups"
  redirectUrl: ""       # default: <publicUrl>/auth/oidc/callback
  buttonLabel: ""       # default derived from the issuer host
  usernameClaim: ""     # default: email
  emailClaim: ""
  nameClaim: ""
  groupsClaim: ""       # default: groups
  autoProvision: true
  defaultRole: viewer
  # Map provider groups onto KMate roles. Leave empty to give everyone
  # defaultRole and assign cluster access by grant instead.
  adminGroups: ""
  operatorGroups: ""
  viewerGroups: ""

# Set false to require single sign-on once OIDC works. Ignored (and forced back
# on) when no OIDC issuer is configured, so the hub can never lock everyone out.
localLogin: true
logLevel: info

persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  clientPort: 8080
  agentPort: 9090
  metricsPort: 9091

# Istio VirtualService (optional)
istio:
  enabled: false
  host: ""                 # e.g. kmate.dev-internal.example.com
  gateway: ""              # e.g. istio-system/dev-internal-gateway
  timeout: 3600s           # long: watches, logs and terminals are long-lived streams
  exposeAgentPort: false   # also route <host>:9090? (agents outside the cluster need gRPC; usually a separate TLS passthrough)

# Plain Ingress (optional)
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  annotations: {}

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: "1",  memory: 1Gi }

podDisruptionBudget:
  enabled: true
  # Not minAvailable: 1. With a single replica that budget can never be met, so
  # it would block every node drain, GKE upgrade and autoscaler scale-down.
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
